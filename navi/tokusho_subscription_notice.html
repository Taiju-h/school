<section>
    <h2>継続決済について</h2>
    <ul>
        <li>
            継続決済をクレジットカードでお申込みの方は、申込日を起点として
            毎月自動的に課金されます。解約手続きが完了するまで同じコースが継続します。
        </li>
        <li>
            解約をご希望の場合は、NAVIにログインした状態で
            「定額コース解約」画面からお手続きください。
            ログイン中の会員情報により対象契約を確認します。
        </li>
        <li>
            次回以降の継続決済を停止する場合は、
            次回課金日の前日までに解約手続きを完了してください。
        </li>
    </ul>
</section>
